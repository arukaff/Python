<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>PDF RAG Search</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; }
        .container { 
            display: flex; 
            height: 100%;
        }
        #left-frame {
            width: 300px;
            background: #f0f0f0;
            padding: 20px;
            border-right: 1px solid #ccc;
        }
        #right-frame {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #context-frame {
            height: 50%;
            border-bottom: 1px solid #ccc;
            padding: 20px;
            overflow-y: auto;
        }
        #answer-frame {
            height: 50%;
            padding: 20px;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 15px; }
        input[type="file"] { margin-bottom: 10px; }
        textarea { width: 100%; height: 100px; }
        button { 
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .context-item { 
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="left-frame">
            <h2>Поиск в PDF</h2>
            <div class="form-group">
                <input type="file" id="pdfFile" accept=".pdf">
                <div id="fileInfo"></div>
            </div>
            <div class="form-group">
                <textarea id="queryInput" placeholder="Введите ваш вопрос..."></textarea>
            </div>
            <button onclick="askQuestion()">Задать вопрос</button>
        </div>
        
        <div id="right-frame">
            <div id="context-frame">
                <h3>Релевантный контекст:</h3>
                <div id="contextList"></div>
            </div>
            <div id="answer-frame">
                <h3>Ответ системы:</h3>
                <div id="answerContent"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('pdfFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const formData = new FormData();
                formData.append('file', file);
                
                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('fileInfo').innerHTML = 
                        `Файл: ${file.name}<br>Страниц: ${data.pages}`;
                })
                .catch(error => console.error('Error:', error));
            }
        });

        function askQuestion() {
            const query = document.getElementById('queryInput').value;
            if (!query) return alert('Введите вопрос');
            
            document.getElementById('answerContent').innerHTML = 'Обработка...';
            document.getElementById('contextList').innerHTML = '';

            fetch('/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query: query })
            })
            .then(response => response.json())
            .then(data => {
                // Отображаем ответ
                document.getElementById('answerContent').innerHTML = 
                    `<p>${data.answer}</p><small>Источники: страницы ${data.sources.join(', ')}</small>`;

                // Отображаем контекст
                const contextList = document.getElementById('contextList');
                data.contexts.forEach((context, index) => {
                    contextList.innerHTML += `
                        <div class="context-item">
                            <strong>Контекст #${index+1}:</strong>
                            <p>${context.substring(0, 200)}...</p>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('answerContent').innerHTML = 
                    'Ошибка: ' + error.message;
            });
        }
    </script>
</body>
</html>
